name: Validación Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev,packaging]"
      - name: Ejecutar pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Construir ejecutable
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - name: Conservar distribución Windows
        uses: actions/upload-artifact@v4
        with:
          name: HairSalonManagement-windows
          path: dist/HairSalonManagement
          if-no-files-found: error
          retention-days: 14
