[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hair-salon-management"
version = "0.1.0"
description = "Gestión local de peluquerías — incremento base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
packaging = ["pyinstaller>=6.10,<7"]

[project.scripts]
hair-salon-management = "hair_salon_management.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
